# Полный стек: PostgreSQL + FastAPI + nginx (статика frontend/). Запуск: docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-duty}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-duty}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8000
      # Уведомления :55/:00 считают слот от локального времени процесса; без TZ в контейнере часто UTC.
      TZ: ${TZ:-UTC}
      # Внутри сети compose хост БД — `db`, не 127.0.0.1 из .env разработчика.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-duty}
      EXPORTS_DIR: /exports
      # CORS не обязателен, если фронт отдаёт nginx с того же origin.
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_COOKIE_HTTPS_ONLY: "${SESSION_COOKIE_HTTPS_ONLY:-false}"
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      N8N_WEBHOOK_TIMEOUT_SEC: ${N8N_WEBHOOK_TIMEOUT_SEC:-5}
      BITRIX_INCOMING_WEBHOOK_URL: ${BITRIX_INCOMING_WEBHOOK_URL:-}
      BITRIX_NOTIFY_DIALOG_ID: ${BITRIX_NOTIFY_DIALOG_ID:-}
      BITRIX_WEBHOOK_TIMEOUT_SEC: ${BITRIX_WEBHOOK_TIMEOUT_SEC:-10}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_FULLNAME: ${BOOTSTRAP_ADMIN_FULLNAME:-}
    volumes:
      - ./exports:/exports
    # CMD-SHELL: надёжно и в Docker, и в Podman (exec-форма с python -c и запятыми в Podman давала SyntaxError).
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    restart: unless-stopped

volumes:
  pgdata:
