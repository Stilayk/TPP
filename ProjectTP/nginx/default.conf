server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Базовые заголовки (HSTS добавляйте только на server с listen 443 ssl)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Frontend: отдаём статику из /usr/share/nginx/html
  location / {
    # Чтобы после депоя не подтягивался старый app.js из кэша браузера/CDN
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }

  # Backend API (^~ — не отдавать SPA index.html вместо /api/*)
  location ^~ /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Excel exports (скачивания/просмотр)
  location /exports/ {
    proxy_pass http://backend:8000/exports/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Публичная страница инструкции «выход сотрудника» по токену (QR)
  location ^~ /p/ {
    proxy_pass http://backend:8000/p/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

