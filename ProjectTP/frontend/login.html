<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Вход</title>
    <link rel="stylesheet" href="./styles.css?v=20260408-11" />
  </head>
  <body>
    <main class="container auth-page">
      <h1>Вход в систему техподдержки</h1>
      <form id="loginForm" class="card auth-card" autocomplete="off">
        <div class="field">
          <label for="loginUsername">Логин</label>
          <input id="loginUsername" name="username" type="text" required />
        </div>
        <div class="field">
          <label for="loginPassword">Пароль</label>
          <input id="loginPassword" name="password" type="password" required />
        </div>

        <div class="actions">
          <button class="btn primary" type="submit">Войти</button>
        </div>

        <div id="loginError" class="msg error" role="alert" hidden></div>
      </form>
    </main>

    <script src="./app.js?v=20260408-11" defer></script>
  </body>
</html>
